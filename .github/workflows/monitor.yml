name: Monitor official internship sources
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: internship-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: monitor/requirements.txt
      - run: pip install -r monitor/requirements.txt
      - name: Run monitors
        continue-on-error: true
        env:
          PROFILE_GPA: ${{ secrets.PROFILE_GPA }}
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD || '75' }}
        run: python monitor/run.py
      - name: Create GitHub issue alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create internship-alert --color 1f883d --description "New high-priority official internship" --force
          python - <<'PY' > /tmp/alerts.tsv
          import json
          for a in json.load(open('data/pending_alerts.json')):
              print('\t'.join(str(a.get(k,'') or '').replace('\t',' ') for k in ['company','title','location','priority','career_value','detected','deadline','apply_url']))
          PY
          while IFS=$'\t' read -r company title location priority career detected deadline apply; do
            [ -z "$company" ] && continue
            gh issue create --title "ALERT: $company — $title" --body "**$company — $title — $location**

Server-lite Priority: **$priority** | Career Value seed: **$career**

Detected: $detected
Deadline: ${deadline:-Not stated}

[APPLY NOW]($apply)

> The browser recalculates the full profile-aware score locally. This automated alert score intentionally does not expose your resume/application data." --label "internship-alert" || true
          done < /tmp/alerts.tsv
      - name: Commit monitor state and feed
        shell: bash
        run: |
          git config user.name "internship-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/employers.json data/jobs.json data/monitor_health.json data/monitor_state.json data/pending_alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "monitor: $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
            git push
          fi
