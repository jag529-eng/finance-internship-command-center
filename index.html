<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="description" content="Zero-cost finance internship recruiting command center" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/styles.css" />
  <title>Finance Recruiting Terminal</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">$0 FINANCE INTERNSHIP COMMAND CENTER</div>
      <h1>Recruiting Terminal</h1>
    </div>
    <div class="top-actions">
      <button class="btn secondary" id="importBtn">Import</button>
      <button class="btn secondary" id="exportBtn">Export</button>
      <button class="btn" id="profileBtn">Profile</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button data-view="dashboard" class="tab active">Dashboard</button>
    <button data-view="opportunities" class="tab">Opportunities</button>
    <button data-view="applications" class="tab">Applications</button>
    <button data-view="calendar" class="tab">Calendar</button>
    <button data-view="health" class="tab">Monitoring Health</button>
    <button data-view="employers" class="tab">Employers</button>
  </nav>

  <main id="app"></main>
  <input id="importFile" type="file" accept="application/json,.json" hidden />

  <dialog id="profileDialog" class="modal">
    <form method="dialog" id="profileForm">
      <div class="modal-head"><h2>Candidate Profile</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
      <div class="form-grid">
        <label>University<input name="university" /></label>
        <label>Major<input name="major" /></label>
        <label>GPA<input name="gpa" type="number" min="0" max="4" step="0.01" /></label>
        <label>Graduation year<input name="graduationYear" type="number" min="2026" max="2040" /></label>
        <label>Work authorization<select name="workAuthorization"><option>US Authorized</option><option>Sponsorship Required</option><option>Other / Unknown</option></select></label>
        <label>Alert threshold<input name="alertThreshold" type="number" min="0" max="100" /></label>
        <label>Fit weight<input name="fitWeight" type="number" min="0" max="1" step="0.01" /></label>
        <label>Career value weight<input name="careerWeight" type="number" min="0" max="1" step="0.01" /></label>
        <label>NYC bonus<input name="nycBonus" type="number" min="0" max="30" /></label>
        <label>Seattle bonus<input name="seattleBonus" type="number" min="0" max="30" /></label>
        <label>Boston bonus<input name="bostonBonus" type="number" min="0" max="30" /></label>
      </div>
      <label>Location priorities <span class="hint">comma-separated, highest first</span><input name="locations" /></label>
      <label>Career interests <span class="hint">comma-separated</span><textarea name="careerInterests" rows="3"></textarea></label>
      <label>Experience / resume signals <span class="hint">used for local scoring</span><textarea name="experience" rows="5"></textarea></label>
      <label>Skills / coursework / certifications<textarea name="skills" rows="4"></textarea></label>
      <label>Resume file <input name="resume" type="file" accept="application/pdf,.pdf" /></label>
      <div id="resumeStatus" class="hint"></div>
      <div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button class="btn" value="default" id="saveProfileBtn">Save profile</button></div>
    </form>
  </dialog>

  <dialog id="employerDialog" class="modal">
    <form method="dialog" id="employerForm">
      <div class="modal-head"><h2>Add Employer</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
      <div class="form-grid">
        <label>Company<input name="company" required /></label>
        <label>Company type<input name="company_type" placeholder="Boutique Investment Bank" /></label>
        <label>Industry<input name="industry" placeholder="Financial Services" /></label>
        <label>ATS<select name="ats"><option>Unknown</option><option>Greenhouse</option><option>Lever</option><option>Workday</option><option>Custom</option></select></label>
      </div>
      <label>Official careers URL<input name="careers_url" type="url" /></label>
      <label>Relevant categories<input name="relevant_categories" placeholder="Investment Banking, Valuation" /></label>
      <label>Office locations<input name="office_locations" placeholder="New York, NY; Seattle, WA" /></label>
      <div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button class="btn" value="default" id="saveEmployerBtn">Add employer</button></div>
    </form>
  </dialog>

  <dialog id="applicationDialog" class="modal">
    <form method="dialog" id="applicationForm">
      <div class="modal-head"><h2>Application Record</h2><button class="icon-btn" value="cancel">×</button></div>
      <input type="hidden" name="opportunityId" />
      <div class="form-grid">
        <label>Status<select name="status"></select></label>
        <label>Date applied<input name="dateApplied" type="datetime-local" /></label>
        <label>Recruiter<input name="recruiter" /></label>
        <label>Recruiter contact<input name="recruiterContact" /></label>
        <label>Referral<input name="referral" /></label>
        <label>Assessment deadline<input name="assessmentDeadline" type="datetime-local" /></label>
        <label>Interview date<input name="interviewDate" type="datetime-local" /></label>
        <label>Follow-up date<input name="followUpDate" type="datetime-local" /></label>
      </div>
      <label>Networking contacts<textarea name="networkingContacts" rows="2"></textarea></label>
      <label>Interview notes<textarea name="interviewNotes" rows="4"></textarea></label>
      <label>Cover letter / notes<textarea name="notes" rows="4"></textarea></label>
      <label>Compensation / offer information<textarea name="offerInfo" rows="3"></textarea></label>
      <div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button class="btn" value="default" id="saveApplicationBtn">Save</button></div>
    </form>
  </dialog>

  <script src="src/app.js" defer></script>
</body>
</html>
